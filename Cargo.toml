[package]
name = "daw"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"   # cross-platform audio I/O
rtrb = "0.3"    # lock-free single-producer/single-consumer ring buffer
symphonia = { version = "0.5", features = ["mp3"] }  # audio file decoding
midir = "0.11"   # MIDI input from hardware and virtual ports
eframe = "0.27"  # egui UI framework (window, input, rendering)
serde = { version = "1", features = ["derive"] }  # project files: structure
serde_json = "1"  # project files: the JSON format
clap-sys = "0.5"  # CLAP plugin API: the raw C types and constants
libloading = "0.8"  # loading plugin libraries at runtime

[profile.dev]
opt-level = 1   # unoptimized DSP can be too slow even for testing

# Decoding a long MP3 at opt-level 1 is slow; optimize dependencies fully.
[profile.dev.package."*"]
opt-level = 3
